<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Gateway</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #fff;
        --ink: #1b2130;
        --muted: #5b6476;
        --line: #e1e4ea;
        --soft: #eef0f4;
        --accent: #c2410c;
        --accent-ink: #fff;
        --ok: #15803d;
        --bad: #b91c1c;
        --warn: #a16207;
        --code: #f0f2f5;
        --c1: #c2410c;
        --c2: #2563eb;
        --c3: #0d9488;
        --c4: #7c3aed;
        --c5: #ca8a04;
        --c6: #db2777;
        --c7: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1216;
          --card: #181c22;
          --ink: #e6e9ee;
          --muted: #9aa3b1;
          --line: #2a3039;
          --soft: #20252d;
          --accent: #fb923c;
          --accent-ink: #1b1206;
          --ok: #4ade80;
          --bad: #f87171;
          --warn: #facc15;
          --code: #222831;
          --c1: #fb923c;
          --c2: #60a5fa;
          --c3: #2dd4bf;
          --c4: #a78bfa;
          --c5: #facc15;
          --c6: #f472b6;
          --c7: #94a3b8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      a {
        color: var(--accent);
      }
      .layout {
        display: grid;
        grid-template-columns: 210px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--card);
        border-inline-end: 1px solid var(--line);
        padding: 16px 10px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px 16px;
        font-weight: 650;
      }
      aside a.nav {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 7px;
        color: var(--ink);
        text-decoration: none;
      }
      aside a.nav:hover {
        background: var(--soft);
      }
      aside a.nav.on {
        background: var(--ink);
        color: var(--card);
      }
      aside .grow {
        flex: 1;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        display: inline-block;
        flex: none;
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.bad {
        background: var(--bad);
      }
      .dot.warn {
        background: var(--warn);
      }
      main {
        padding: 22px 24px 60px;
        max-width: 1240px;
        width: 100%;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 18px;
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }
      .grid.two {
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        min-width: 0;
      }
      .card h2 {
        font-size: 14px;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card h2 .right {
        margin-inline-start: auto;
        font-weight: 400;
      }
      .mt {
        margin-top: 14px;
      }
      .stat .l {
        color: var(--muted);
        font-size: 12px;
      }
      .stat .v {
        font-size: 24px;
        font-weight: 650;
        margin: 2px 0;
        font-variant-numeric: tabular-nums;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: start;
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
        font-size: 12px;
      }
      tr.click {
        cursor: pointer;
      }
      tr.click:hover td {
        background: var(--soft);
      }
      .num {
        text-align: end;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .scroll {
        overflow-x: auto;
      }
      code,
      pre {
        background: var(--code);
        border-radius: 5px;
        font:
          12px ui-monospace,
          Menlo,
          monospace;
      }
      code {
        padding: 1px 5px;
        word-break: break-all;
      }
      pre {
        padding: 10px 12px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 6px 0;
      }
      .muted {
        color: var(--muted);
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 7px 16px;
        align-items: center;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        padding: 6px 12px;
        border-radius: 7px;
        cursor: pointer;
        font: inherit;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.sm {
        padding: 3px 8px;
        font-size: 12px;
      }
      input,
      select,
      textarea {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--ink);
        min-width: 0;
      }
      textarea {
        width: 100%;
        resize: vertical;
      }
      label.f {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      label.f input,
      label.f select {
        color: var(--ink);
      }
      .form {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 99px;
        font-size: 11px;
        background: var(--soft);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.ok {
        background: color-mix(in srgb, var(--ok) 15%, transparent);
        color: var(--ok);
      }
      .pill.bad {
        background: color-mix(in srgb, var(--bad) 15%, transparent);
        color: var(--bad);
      }
      .pill.acc {
        background: color-mix(in srgb, var(--accent) 15%, transparent);
        color: var(--accent);
      }
      .meter {
        height: 8px;
        background: var(--soft);
        border-radius: 99px;
        overflow: hidden;
      }
      .meter > div {
        height: 100%;
        background: var(--ok);
        border-radius: 99px;
        transition: width 0.2s;
      }
      .meter.warn > div {
        background: var(--warn);
      }
      .meter.bad > div {
        background: var(--bad);
      }
      .alert {
        border: 1px solid;
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 12px;
      }
      .alert.bad {
        border-color: var(--bad);
        color: var(--bad);
        background: color-mix(in srgb, var(--bad) 8%, transparent);
      }
      .alert.warn {
        border-color: var(--warn);
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 8%, transparent);
      }
      .chart svg {
        width: 100%;
        height: 180px;
        display: block;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-inline-end: 5px;
        vertical-align: -1px;
      }
      .err {
        color: var(--bad);
        max-width: 460px;
        word-break: break-word;
      }
      .newkey {
        border: 1px solid var(--accent);
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
      }
      .toggle {
        position: relative;
        width: 34px;
        height: 20px;
        appearance: none;
        background: var(--line);
        border-radius: 99px;
        cursor: pointer;
        border: 0;
        padding: 0;
        transition: background 0.15s;
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        inset-inline-start: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: inset-inline-start 0.15s;
      }
      .toggle:checked {
        background: var(--ok);
      }
      .toggle:checked::after {
        inset-inline-start: 16px;
      }
      .drawer {
        position: fixed;
        inset-block: 0;
        inset-inline-end: 0;
        width: min(480px, 100%);
        background: var(--card);
        border-inline-start: 1px solid var(--line);
        padding: 18px;
        overflow: auto;
        box-shadow: -10px 0 30px rgb(0 0 0 / 0.15);
        z-index: 10;
      }
      .out {
        white-space: pre-wrap;
        background: var(--code);
        border-radius: 8px;
        padding: 12px;
        min-height: 80px;
        font-size: 13px;
      }
      #login {
        max-width: 360px;
        margin: 12vh auto;
      }
      .hidden {
        display: none !important;
      }
      #toast {
        position: fixed;
        bottom: 16px;
        inset-inline-end: 16px;
        background: var(--ink);
        color: var(--card);
        padding: 9px 14px;
        border-radius: 8px;
        z-index: 20;
      }
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          height: auto;
          flex-direction: row;
          flex-wrap: wrap;
          padding: 10px 12px;
          border-inline-end: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          padding: 4px 8px;
          width: 100%;
        }
        aside .grow {
          display: none;
        }
        main {
          padding: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="login" class="card hidden">
      <h2>Claude Gateway</h2>
      <form id="loginForm" class="row">
        <input
          id="pw"
          type="password"
          placeholder="Admin password"
          autocomplete="current-password"
          style="flex: 1"
          aria-label="Admin password"
        />
        <button class="btn primary">Sign in</button>
      </form>
      <p id="loginErr" class="bad small"></p>
      <p class="muted small">
        The password is in <code>ADMIN_PASSWORD.txt</code> in the gateway
        folder, unless you changed it.
      </p>
    </div>

    <div id="app" class="layout hidden">
      <aside>
        <div class="brand">
          <span id="dot" class="dot"></span> Claude Gateway
        </div>
        <a class="nav" href="#overview">Overview</a>
        <a class="nav" href="#projects">Projects</a>
        <a class="nav" href="#models">Models</a>
        <a class="nav" href="#usage">Usage</a>
        <a class="nav" href="#requests">Requests</a>
        <a class="nav" href="#playground">Playground</a>
        <a class="nav" href="#settings">Settings</a>
        <div class="grow"></div>
        <a class="nav" href="#" id="logout">Sign out</a>
      </aside>
      <main id="main"></main>
    </div>
    <div
      id="drawer"
      class="drawer hidden"
      role="dialog"
      aria-label="Request details"
    ></div>
    <div id="toast" class="hidden" role="status"></div>

    <script>
      // ---------- tiny helpers ----------
      const $ = (s, r = document) => r.querySelector(s);
      function h(tag, props = {}, ...kids) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(props ?? {})) {
          if (v == null || v === false) continue;
          if (k === "class") e.className = v;
          else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
          else if (k === "value") e.value = v;
          else if (k === "checked") e.checked = !!v;
          else e.setAttribute(k, v === true ? "" : v);
        }
        for (const k of kids.flat(9))
          if (k != null && k !== false)
            e.append(
              k instanceof Node ? k : document.createTextNode(String(k)),
            );
        return e;
      }
      const svg = (tag, attrs = {}, ...kids) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        e.append(...kids);
        return e;
      };
      const fmt = (n) => (n ?? 0).toLocaleString();
      const short = (n) => {
        n = n ?? 0;
        return n >= 1e9
          ? (n / 1e9).toFixed(1) + "B"
          : n >= 1e6
            ? (n / 1e6).toFixed(1) + "M"
            : n >= 1e4
              ? (n / 1e3).toFixed(0) + "k"
              : fmt(n);
      };
      const money = (n) => "$" + (n ?? 0).toFixed((n ?? 0) >= 1 ? 2 : 4);
      const msf = (n) =>
        n == null
          ? "—"
          : n >= 10000
            ? (n / 1000).toFixed(1) + " s"
            : n >= 1000
              ? (n / 1000).toFixed(2) + " s"
              : n + " ms";
      const toDate = (s) =>
        new Date(
          typeof s === "number"
            ? s
            : s.includes("T")
              ? s
              : s.replace(" ", "T") + "Z",
        );
      const ago = (s) => {
        if (!s) return "never";
        const d = (Date.now() - toDate(s)) / 1000;
        return d < 60
          ? Math.max(0, Math.round(d)) + "s ago"
          : d < 3600
            ? Math.round(d / 60) + "m ago"
            : d < 86400
              ? Math.round(d / 3600) + "h ago"
              : Math.round(d / 86400) + "d ago";
      };
      const until = (t) => {
        const s = (t - Date.now()) / 1000;
        if (s <= 0) return "now";
        const d = Math.floor(s / 86400),
          hh = Math.floor((s % 86400) / 3600),
          m = Math.floor((s % 3600) / 60);
        return d ? `${d}d ${hh}h` : hh ? `${hh}h ${m}m` : `${m}m`;
      };
      const dur = (s) =>
        s < 3600
          ? Math.round(s / 60) + "m"
          : s < 86400
            ? (s / 3600).toFixed(1) + "h"
            : (s / 86400).toFixed(1) + "d";
      const COLORS = [
        "--c1",
        "--c2",
        "--c3",
        "--c4",
        "--c5",
        "--c6",
        "--c7",
      ].map((v) => `var(${v})`);
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.remove("hidden");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => t.classList.add("hidden"), 2200);
      }
      function copyBtn(text, label = "Copy") {
        return h(
          "button",
          {
            class: "btn sm",
            type: "button",
            onclick: () => {
              navigator.clipboard?.writeText(text);
              toast("Copied");
            },
          },
          label,
        );
      }

      async function api(path, opts = {}) {
        const r = await fetch(path, {
          ...opts,
          headers: {
            "content-type": "application/json",
            "x-cgw": "1",
            ...(opts.headers || {}),
          },
        });
        if (r.status === 401 && !path.endsWith("/login")) {
          showLogin();
          throw new Error("auth");
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || r.statusText);
        return j;
      }
      const send = (path, method, body) =>
        api(path, { method, body: body ? JSON.stringify(body) : undefined });

      function table(cols, rows, onRow) {
        if (!rows?.length)
          return h("p", { class: "muted" }, "Nothing here yet.");
        return h(
          "table",
          {},
          h(
            "thead",
            {},
            h(
              "tr",
              {},
              cols.map((c) => h("th", { class: c.num ? "num" : "" }, c.h)),
            ),
          ),
          h(
            "tbody",
            {},
            rows.map((r) =>
              h(
                "tr",
                {
                  class: onRow ? "click" : "",
                  onclick: onRow ? () => onRow(r) : null,
                },
                cols.map((c) =>
                  h(
                    "td",
                    {
                      class: [c.num ? "num" : "", c.cls ? c.cls(r) : ""].join(
                        " ",
                      ),
                    },
                    c.f ? c.f(r) : r[c.k],
                  ),
                ),
              ),
            ),
          ),
        );
      }
      const statusPill = (s) =>
        h("span", { class: "pill " + (s >= 400 ? "bad" : "ok") }, s);
      function meter(pctv) {
        const p = Math.max(0, Math.min(100, pctv ?? 0));
        return h(
          "div",
          { class: "meter " + (p >= 90 ? "bad" : p >= 70 ? "warn" : "") },
          h("div", { style: `width:${p}%` }),
        );
      }

      // ---------- auth ----------
      function showLogin() {
        $("#app").classList.add("hidden");
        $("#login").classList.remove("hidden");
        $("#pw").focus();
      }
      $("#loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await send("/admin/login", "POST", { password: $("#pw").value });
          $("#pw").value = "";
          $("#loginErr").textContent = "";
          boot();
        } catch (err) {
          $("#loginErr").textContent = err.message;
        }
      });
      $("#logout").addEventListener("click", async (e) => {
        e.preventDefault();
        await send("/admin/logout", "POST").catch(() => {});
        showLogin();
      });

      // ---------- state + routing ----------
      const S = {
        status: null,
        projects: [],
        models: [],
        newKey: null,
        reqFilter: { project: "", model: "", errors: false },
        usageDays: 7,
      };
      const views = {};
      let current = null;
      function route() {
        const tab = (location.hash.slice(1) || "overview").split("?")[0];
        current = views[tab] ? tab : "overview";
        document
          .querySelectorAll("aside a.nav[href^='#']")
          .forEach((a) =>
            a.classList.toggle("on", a.getAttribute("href") === "#" + current),
          );
        $("#drawer").classList.add("hidden");
        render(true);
      }
      window.addEventListener("hashchange", route);
      let rendering = false;
      async function render(force) {
        if (rendering && !force) return;
        rendering = true;
        try {
          const node = await views[current]();
          if (node) $("#main").replaceChildren(node);
        } catch (e) {
          if (e.message !== "auth")
            $("#main").replaceChildren(
              h("div", { class: "alert bad" }, "Could not load: " + e.message),
            );
        } finally {
          rendering = false;
        }
      }
      async function loadStatus() {
        S.status = await api("/admin/api/status");
        const u = S.status.upstream;
        $("#dot").className =
          "dot " +
          (!u.ok
            ? "bad"
            : (S.status.quota?.buckets?.find((b) => b.type === "five_hour")
                  ?.utilization ?? 0) >= 0.9
              ? "warn"
              : "ok");
        return S.status;
      }
      const page = (title, sub, ...kids) =>
        h(
          "div",
          {},
          h("h1", {}, title),
          sub ? h("p", { class: "sub" }, sub) : null,
          ...kids,
        );

      // ---------- overview ----------
      const BUCKET_NAMES = {
        five_hour: "5-hour window",
        seven_day: "7-day window",
        seven_day_opus: "7-day Opus",
        seven_day_sonnet: "7-day Sonnet",
        seven_day_fable: "7-day Fable",
      };
      function quotaCard(st) {
        const q = st.quota;
        return h(
          "div",
          { class: "card" },
          h(
            "h2",
            {},
            "Subscription quota",
            h(
              "span",
              { class: "right muted small" },
              st.upstream.plan
                ? `${st.upstream.plan}${st.upstream.tier ? " · " + st.upstream.tier.replace(/_/g, " ") : ""}`
                : "",
            ),
          ),
          !q
            ? h(
                "p",
                { class: "muted" },
                st.quotaError ? "Not available: " + st.quotaError : "Loading…",
              )
            : h(
                "div",
                { style: "display:grid;gap:12px" },
                q.buckets.map((b) => {
                  const p = Math.round(b.utilization * 100);
                  return h(
                    "div",
                    {},
                    h(
                      "div",
                      { class: "row small" },
                      h(
                        "strong",
                        {},
                        BUCKET_NAMES[b.type] ?? b.type.replace(/_/g, " "),
                      ),
                      h(
                        "span",
                        { class: p >= 90 ? "bad" : p >= 70 ? "warn" : "muted" },
                        p + "% used",
                      ),
                      h(
                        "span",
                        { class: "muted", style: "margin-inline-start:auto" },
                        b.resetsAt ? "resets in " + until(b.resetsAt) : "",
                      ),
                      b.status !== "allowed"
                        ? h("span", { class: "pill bad" }, b.status)
                        : null,
                    ),
                    meter(p),
                  );
                }),

      function stackedChart(byDayProject, days = 14) {
        const keys = [];
        for (let i = days - 1; i >= 0; i--)
          keys.push(
            new Date(Date.now() - i * 864e5).toISOString().slice(0, 10),
          );
        const projects = [
          ...new Set(
            Object.values(byDayProject).flatMap((d) => Object.keys(d)),
          ),
        ];
        const totals = keys.map((k) =>
          Object.values(byDayProject[k] ?? {}).reduce((a, b) => a + b, 0),
        );
        const max = Math.max(1, ...totals);
        const W = 700,
          H = 170,
          pad = 18,
          bw = (W - 40) / days;
        const g = svg("svg", {
          viewBox: `0 0 ${W} ${H + pad}`,
          preserveAspectRatio: "none",
          role: "img",
          "aria-label": "Tokens per day by project",
        });
        keys.forEach((k, i) => {
          let y = H;
          projects.forEach((p, j) => {
            const v = byDayProject[k]?.[p] ?? 0;
            if (!v) return;
            const hh = (v / max) * (H - 10);
            y -= hh;
            const r = svg("rect", {
              x: 36 + i * bw + 3,
              y,
              width: bw - 6,
              height: Math.max(1, hh),
              rx: 2,
              fill: COLORS[j % COLORS.length],
            });
            r.append(
              svg(
                "title",
                {},
                document.createTextNode(`${k} · ${p}: ${fmt(v)} tokens`),
              ),
            );
            g.append(r);
          });
          if (i % 2 === 0 || days <= 7)
            g.append(
              svg(
                "text",
                {
                  x: 36 + i * bw + bw / 2,
                  y: H + 14,
                  "text-anchor": "middle",
                  "font-size": 10,
                  fill: "var(--muted)",
                },
                document.createTextNode(k.slice(5)),
              ),
            );
        });
        g.append(
          svg(
            "text",
            { x: 0, y: 12, "font-size": 10, fill: "var(--muted)" },
            document.createTextNode(short(max)),
          ),
        );
        g.append(
          svg("line", { x1: 34, x2: W, y1: H, y2: H, stroke: "var(--line)" }),
        );
        return h(
          "div",
          { class: "chart" },
          g,
          h(
            "div",
            { class: "legend" },
            projects.length
              ? projects.map((p, j) =>
                  h(
                    "span",
                    {},
                    h("i", {
                      style: `background:${COLORS[j % COLORS.length]}`,
                    }),
                    p,
                  ),
                )
              : h("span", {}, "No traffic yet"),
          ),
        );
      }

              render(true);
            },
          },
          [
            [1, "Today"],
            [7, "7 days"],
            [30, "30 days"],
            [90, "90 days"],
          ].map(([v, l]) =>
            h("option", { value: v, selected: v === S.usageDays }, l),
          ),
        );
        const cols = (first) => [
          first,
          { h: "Requests", num: 1, f: (r) => fmt(r.n) },
          {
            h: "Errors",
            num: 1,
            f: (r) => fmt(r.err),
            cls: (r) => (r.err ? "bad" : ""),
          },
          { h: "Input", num: 1, f: (r) => short(r.in_tok) },
          { h: "Output", num: 1, f: (r) => short(r.out_tok) },
          { h: "Cache", num: 1, f: (r) => short(r.cache) },
          { h: "Est. cost", num: 1, f: (r) => money(r.cost) },
          { h: "First token p50", num: 1, f: (r) => msf(r.ttfb50) },
          { h: "p50", num: 1, f: (r) => msf(r.p50) },
          { h: "p95", num: 1, f: (r) => msf(r.p95) },
        ];
        const t = u.total ?? {};
        const stat = (l, v) =>
          h(
            "div",
            { class: "card stat" },
            h("div", { class: "l" }, l),
            h("div", { class: "v" }, v),
          );
        return page(
          "Usage",
          "Per project, model, day and address.",
          h(
            "div",
            { class: "row" },
            h("label", { class: "row" }, "Period ", sel),
            h(
              "a",
              {
                class: "btn",
                href: `/admin/api/requests.csv?days=${Math.max(1, S.usageDays)}`,
              },
              "Export CSV",
            ),
          ),
          h(
            "div",
            { class: "grid mt" },
            stat("Requests", fmt(t.n)),
            stat(
              "Tokens",
              short((t.in_tok ?? 0) + (t.out_tok ?? 0) + (t.cache ?? 0)),
            ),
            stat("Est. cost", money(t.cost)),
            stat("Latency p50 / p95", `${msf(t.p50)} / ${msf(t.p95)}`),
            stat("Errors", fmt(t.err)),
          ),
          u.days > 1
            ? h(
                "div",
                { class: "card mt" },
                h("h2", {}, "Tokens per day by project"),
                stackedChart(u.byDayProject, Math.min(u.days, 30)),
              )
            : null,
          h(
            "div",
            { class: "card mt scroll" },
            h("h2", {}, "By project"),
            table(cols({ h: "Project", k: "key" }), u.byProject),
          ),
          h(
            "div",
            { class: "card mt scroll" },
            h("h2", {}, "By model"),
            table(cols({ h: "Model", k: "key" }), u.byModel),
          ),
          h(
            "div",
            { class: "card mt scroll" },
            h("h2", {}, "By day"),
            table(cols({ h: "Day", k: "key" }), [...u.byDay].reverse()),
          ),
          h(
            "div",
            { class: "card mt scroll" },
            h("h2", {}, "By address"),
            table(
              [
                { h: "IP", k: "key" },
                { h: "Requests", num: 1, f: (r) => fmt(r.n) },
                { h: "Errors", num: 1, f: (r) => fmt(r.err) },
              ],
              u.byIp,
            ),
          ),
          h(
            "p",
            { class: "muted small" },
            "Cost is an estimate of what the same tokens would cost on the paid API. Your subscription is not billed per token.",
            u.capped ? " Only the latest 50,000 requests are counted." : "",
          ),
        );
      };

      // ---------- requests ----------
      function openRequest(r) {
        const d = $("#drawer");
        const row = (k, v) => [
          h("span", { class: "muted" }, k),
          h("span", {}, v ?? "—"),
        ];
        d.replaceChildren(
          h(
            "div",
            { class: "row" },
            h("h2", { style: "margin:0" }, "Request #" + r.id),
            h(
              "button",
              {
                class: "btn sm",
                style: "margin-inline-start:auto",
                onclick: () => d.classList.add("hidden"),
              },
              "Close",
            ),
          ),
          h(
            "div",
            { class: "kv mt" },
            row("Time", toDate(r.ts).toLocaleString()),
            row("Project", r.project ?? "(no valid key)"),
            row("Address", r.ip),
            row("Client", r.user_agent),
            row("Endpoint", h("code", {}, `${r.method} ${r.path}`)),
            row("Model", r.model),
            row("Streaming", r.stream ? "yes" : "no"),
            row("Status", statusPill(r.status)),
            row("Total time", msf(r.ms)),
            row("First token", msf(r.ttfb_ms)),
            row("Queue wait", msf(r.queue_ms)),
            row("Max tokens", r.max_tokens),
            row("Input tokens", fmt(r.in_tok)),
            row("Cache read", fmt(r.cache_read)),
            row("Cache write", fmt(r.cache_write)),
            row("Output tokens", fmt(r.out_tok)),
            row("Est. cost", money(r.cost)),
          ),
          r.error
            ? h(
                "div",
                { class: "mt" },
                h("strong", {}, "Error"),
                h("pre", { class: "err" }, r.error),
              )
            : null,
          h(
            "p",
            { class: "muted small mt" },
            "Prompts and replies are never stored.",
          ),
        );
        d.classList.remove("hidden");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") $("#drawer").classList.add("hidden");
      });
      views.requests = async () => {
        if (location.hash.includes("errors")) S.reqFilter.errors = true;
        const F = S.reqFilter;
        if (!S.projects.length) S.projects = await api("/admin/api/projects");
        if (!S.models.length) S.models = await api("/admin/api/models");
        const qs = (before) =>
          `/admin/api/requests?limit=100${F.project ? "&project=" + F.project : ""}${F.model ? "&model=" + encodeURIComponent(F.model) : ""}${F.errors ? "&errors=1" : ""}${before ? "&before=" + before : ""}`;
        let rows = await api(qs());
        const cols = [
          {
            h: "When",
            f: (r) =>
              h("span", { title: toDate(r.ts).toLocaleString() }, ago(r.ts)),
          },
          { h: "Project", f: (r) => r.project ?? "—" },
          { h: "IP", k: "ip" },
          { h: "Path", f: (r) => h("code", {}, r.path) },
          { h: "Model", f: (r) => r.model ?? "" },
          { h: "Status", f: (r) => statusPill(r.status) },
          { h: "Time", num: 1, f: (r) => msf(r.ms) },
          { h: "1st token", num: 1, f: (r) => msf(r.ttfb_ms) },
          {
            h: "In",
            num: 1,
            f: (r) => short(r.in_tok + r.cache_read + r.cache_write),
          },
          { h: "Out", num: 1, f: (r) => short(r.out_tok) },
          { h: "Est.", num: 1, f: (r) => money(r.cost) },
          {
            h: "Error",
            f: (r) => (r.error ? r.error.slice(0, 80) : ""),
            cls: () => "err",
          },
        ];
        const wrap = h(
          "div",
          { class: "scroll" },
          table(cols, rows, openRequest),
        );
        const more = h(
          "button",
          {
            class: "btn mt",
            type: "button",
            onclick: async () => {
              const next = await api(qs(rows.at(-1)?.id));
              rows = rows.concat(next);
              wrap.replaceChildren(table(cols, rows, openRequest));
              if (next.length < 100) more.remove();
            },
          },
          "Load more",
        );
        const set = (k) => (e) => {
          F[k] =
            e.target.type === "checkbox" ? e.target.checked : e.target.value;
          if (k === "errors" && !F.errors && location.hash.includes("errors"))
            history.replaceState(null, "", "#requests");
          render(true);
        };
        return page(
          "Requests",
          "Every call through the gateway. Click a row for details.",
          h(
            "div",
            { class: "card" },
            h(
              "div",
              { class: "row" },
              h(
                "select",
                { "aria-label": "Project", onchange: set("project") },
                h("option", { value: "" }, "All projects"),
                S.projects.map((p) =>
                  h(
                    "option",
                    { value: p.id, selected: String(p.id) === F.project },
                    p.name,
                  ),
                ),
              ),
              h(
                "select",
                { "aria-label": "Model", onchange: set("model") },
                h("option", { value: "" }, "All models"),
                S.models.map((m) =>
                  h(
                    "option",
                    { value: m.id, selected: m.id === F.model },
                    m.id,
                  ),
                ),
              ),
              h(
                "label",
                { class: "row small" },
                h("input", {
                  type: "checkbox",
                  checked: F.errors,
                  onchange: set("errors"),
                }),
                "Errors only",
              ),
              F.errors
                ? h(
                    "button",
                    {
                      class: "btn sm",
                      type: "button",
                      onclick: async () => {
                        if (
                          !confirm(
                            "Clear stored error messages? The requests stay.",
                          )
                        )
                          return;
                        await send("/admin/api/errors", "DELETE");
                        toast("Cleared");
                        render(true);
                      },
                    },
                    "Clear messages",
                  )
                : null,
              h(
                "a",
                {
                  class: "btn sm",
                  href: "/admin/api/requests.csv?days=30",
                  style: "margin-inline-start:auto",
                },
                "Export CSV",
              ),
            ),
            h("div", { class: "mt" }, wrap),
            rows.length >= 100 ? more : null,
          ),
        );
      };

      // ---------- playground ----------
      views.playground = async () => {
        if (!S.models.length) S.models = await api("/admin/api/models");
        if (!S.status) await loadStatus();
        const model = h(
          "select",
          { "aria-label": "Model" },
          S.models
            .filter((m) => m.enabled)
            .map((m) =>
              h(
                "option",
                {
                  value: m.id,
                  selected: m.id === S.status.connection.defaultModel,
                },
                m.name,
              ),
            ),
        );
        const system = h("textarea", {
          rows: 2,
          placeholder: "System prompt (optional)",
          "aria-label": "System prompt",
        });
        const prompt_ = h("textarea", {
          rows: 5,
          placeholder: "Ask something…",
          "aria-label": "Prompt",
        });
        const maxT = h("input", {
          type: "number",
          value: 512,
          min: 1,
          max: 8192,
          style: "width:90px",
          "aria-label": "Max tokens",
        });
        const temp = h("input", {
          type: "number",
          step: "0.1",
          min: 0,
          max: 1,
          placeholder: "default",
          style: "width:90px",
          "aria-label": "Temperature",
        });
        const out = h("div", { class: "out muted" }, "The reply appears here.");
        const meta = h("div", { class: "row small muted mt" });
        const go = h(
          "button",
          { class: "btn primary", type: "submit" },
          "Send",
        );
        const form = h(
          "form",
          {
            onsubmit: async (e) => {
              e.preventDefault();
              go.disabled = true;
              out.className = "out muted";
              out.textContent = "Waiting for the reply…";
              meta.replaceChildren();
              try {
                const r = await send("/admin/api/playground", "POST", {
                  model: model.value,
                  system: system.value,
                  prompt: prompt_.value,
                  maxTokens: maxT.value,
                  temperature: temp.value,
                });
                out.className = "out " + (r.ok ? "" : "bad");
                out.textContent = r.text || "(empty reply)";
                meta.replaceChildren(
                  h("span", {}, msf(r.ms)),
                  r.usage
                    ? h(
                        "span",
                        {},
                        `${fmt(r.usage.in_tok + r.usage.cache_read + r.usage.cache_write)} in · ${fmt(r.usage.out_tok)} out`,
                      )
                    : null,
                  r.cost != null ? h("span", {}, "≈ " + money(r.cost)) : null,
                  r.stopReason ? h("span", {}, "stop: " + r.stopReason) : null,
                );
              } catch (err) {
                out.className = "out bad";
                out.textContent = err.message;
              } finally {
                go.disabled = false;
              }
            },
          },
          h(
            "div",
            { class: "row" },
            h("label", { class: "f" }, "Model", model),
            h("label", { class: "f" }, "Max tokens", maxT),
            h("label", { class: "f" }, "Temperature", temp),
          ),
          h("div", { class: "mt" }, system),
          h("div", { class: "mt" }, prompt_),
          h(
            "div",
            { class: "row mt" },
            go,
            h(
              "span",
              { class: "muted small" },
              "Logged as “Playground”, without project.",
            ),
          ),
        );
        prompt_.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey))
            form.requestSubmit();
        });
        return page(
          "Playground",
          "Try a model straight from the dashboard. ⌘↵ sends.",
          h(
            "div",
            { class: "grid two" },
            h("div", { class: "card" }, form),
            h("div", { class: "card" }, h("h2", {}, "Reply"), out, meta),
          ),
        );
      };

      // ---------- settings ----------
      views.settings = async () => {
        const [s, st] = await Promise.all([
          api("/admin/api/settings"),
          loadStatus(),
        ]);
        const field = (label, key, type = "number", help) =>
          h(
            "label",
            { class: "f" },
            label,
            h("input", { type, "data-k": key, value: s[key] ?? "" }),
            help ? h("span", {}, help) : null,
          );
        const gen = h(
          "div",
          { class: "form" },
          field(
            "Requests running at once",
            "maxConcurrent",
            "number",
            "1–8. More uses more memory.",
          ),
          field(
            "Waiting queue size",
            "maxQueue",
            "number",
            "Extra requests get 429 above this.",
          ),
          field("Request timeout (ms)", "requestTimeoutMs"),
          field("Keep history (days)", "retentionDays"),
          field(
            "Wrong keys per minute before block",
            "badKeyLimit",
            "number",
            "Blocks the address for 10 minutes.",
          ),
          field(
            "Address shown to clients",
            "publicHost",
            "text",
            "Host or IP used in connection details.",
          ),
        );
        const prices = h(
          "div",
          { class: "form" },
          Object.entries(s.pricing).map(([fam, p]) =>
            h(
              "label",
              { class: "f" },
              fam + " ($/M in · out)",
              h(
                "div",
                { class: "row", style: "flex-wrap:nowrap" },
                h("input", {
                  type: "number",
                  step: "0.01",
                  "data-fam": fam,
                  "data-io": "in",
                  value: p.in,
                  style: "width:80px",
                }),
                h("input", {
                  type: "number",
                  step: "0.01",
                  "data-fam": fam,
                  "data-io": "out",
                  value: p.out,
                  style: "width:80px",
                }),
              ),
            ),
          ),
        );
        const cur = h("input", {
          type: "password",
          placeholder: "Current password",
          autocomplete: "current-password",
          "aria-label": "Current password",
        });
        const next = h("input", {
          type: "password",
          placeholder: "New password (10+ characters)",
          autocomplete: "new-password",
          "aria-label": "New password",
        });
        return page(
          "Settings",
          "Changes apply right away.",
          h(
            "div",
            { class: "card" },
            h("h2", {}, "Gateway"),
            gen,
            h(
              "button",
              {
                class: "btn primary mt",
                type: "button",
                onclick: async () => {
                  const b = {};
                  gen
                    .querySelectorAll("[data-k]")
                    .forEach((i) => (b[i.dataset.k] = i.value));
                  try {
                    await send("/admin/api/settings", "PATCH", b);
                    toast("Settings saved");
                  } catch (e) {
                    toast(e.message);
                  }
                },
              },
              "Save settings",
            ),
          ),
          h(
            "div",
            { class: "card mt" },
            h("h2", {}, "Family prices for cost estimates"),
            prices,
            h(
              "button",
              {
                class: "btn primary mt",
                type: "button",
                onclick: async () => {
                  const pricing = {};
                  prices
                    .querySelectorAll("[data-fam]")
                    .forEach(
                      (i) =>
                        ((pricing[i.dataset.fam] ??= {})[i.dataset.io] =
                          i.value),
                    );
                  try {
                    await send("/admin/api/settings", "PATCH", { pricing });
                    toast("Prices saved");
                  } catch (e) {
                    toast(e.message);
                  }
                },
              },
              "Save prices",
            ),
            h(
              "p",
              { class: "muted small" },
              "A price set on a single model (Models tab) wins over these.",
            ),
          ),
          h(
            "div",
            { class: "grid two mt" },
            h(
              "div",
              { class: "card" },
              h("h2", {}, "Backend"),
              h(
                "div",
                { class: "kv" },
                h("span", { class: "muted" }, "Status"),
                h(
                  "span",
                  { class: st.upstream.ok ? "ok" : "bad" },
                  st.upstream.status,
                ),
                h("span", { class: "muted" }, "Meridian"),
                h(
                  "span",
                  {},
                  `${st.upstream.version ?? "?"} · ${st.upstream.mode ?? ""}`,
                ),
                h("span", { class: "muted" }, "Claude sign-in"),
                h(
                  "span",
                  { class: st.upstream.loggedIn ? "ok" : "bad" },
                  st.upstream.loggedIn
                    ? `Signed in · renews in ${st.upstream.daysUntilRenewal ?? "?"} days`
                    : "Not signed in",
                ),
                h("span", { class: "muted" }, "CLI"),
                h("code", {}, st.upstream.cli ?? "—"),
                h("span", { class: "muted" }, "Ports"),
                h(
                  "span",
                  {},
                  s.ports.https ? `https ${s.ports.https} · ` : "",
                  `http ${s.ports.http}`,
                ),
              ),
              h(
                "div",
                { class: "row mt" },
                h(
                  "button",
                  {
                    class: "btn",
                    type: "button",
                    onclick: async (e) => {
                      if (
                        !confirm(
                          "Restart the backend? Requests in flight will fail.",
                        )
                      )
                        return;
                      e.target.disabled = true;
                      try {
                        await send("/admin/api/restart-backend", "POST");
                        toast("Restarting…");
                        setTimeout(() => render(true), 4000);
                      } catch (err) {
                        toast(err.message);
                      } finally {
                        e.target.disabled = false;
                      }
                    },
                  },
                  "Restart backend",
                ),
              ),
              h(
                "p",
                { class: "muted small" },
                "Logs: ",
                h("code", {}, "logs/meridian.log"),
                " · ",
                h("code", {}, "logs/proxy.log"),
                ". Meridian's own telemetry (this Mac only): ",
                h("code", {}, "http://127.0.0.1:4101/telemetry"),
              ),
            ),
            h(
              "div",
              { class: "card" },
              h("h2", {}, "Admin password"),
              h(
                "form",
                {
                  class: "row",
                  onsubmit: async (e) => {
                    e.preventDefault();
                    try {
                      await send("/admin/api/password", "POST", {
                        current: cur.value,
                        next: next.value,
                      });
                      toast("Password changed. Sign in again.");
                      setTimeout(showLogin, 900);
                    } catch (err) {
                      toast(err.message);
                    }
                  },
                },
                cur,
                next,
                h("button", { class: "btn primary" }, "Change"),
              ),
              h(
                "p",
                { class: "muted small" },
                "Changing it signs out every dashboard session.",
              ),
            ),
          ),
          h(
            "div",
            { class: "card mt" },
            h("h2", {}, "Blocked addresses"),
            st.blockedIps?.length
              ? table(
                  [
                    { h: "IP", k: "ip" },
                    {
                      h: "Blocked until",
                      f: (r) => new Date(r.until).toLocaleTimeString(),
                    },
                    {
                      h: "",
                      f: (r) =>
                        h(
                          "button",
                          {
                            class: "btn sm",
                            onclick: async () => {
                              await send("/admin/api/unblock", "POST", {
                                ip: r.ip,
                              });
                              toast("Unblocked");
                              render(true);
                            },
                          },
                          "Unblock",
                        ),
                    },
                  ],
                  st.blockedIps,
                )
              : h(
                  "p",
                  { class: "muted" },
                  "None. Addresses that send many wrong keys are blocked for 10 minutes.",
                ),
          ),
        );
      };

      // ---------- boot ----------
      async function boot() {
        try {
          await loadStatus();
        } catch {
          return;
        }
        $("#login").classList.add("hidden");
        $("#app").classList.remove("hidden");
        route();
      }
      setInterval(() => {
        if ($("#app").classList.contains("hidden") || document.hidden) return;
        // Pages with forms refresh only after actions, so typing is never lost.
        if (
          ["overview", "usage", "requests"].includes(current) &&
          $("#drawer").classList.contains("hidden") &&
          !document.activeElement?.matches("input,select,textarea")
        )
          render();
        else loadStatus().catch(() => {});
      }, 10000);
      boot();
    </script>
  </body>
</html>
